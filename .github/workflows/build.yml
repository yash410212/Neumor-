name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ZIP_NAME: ModernLauncher_TecnoSpark8C_VivoY11_UX_v1.5.zip
  PROJECT_DIR: android-project

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP_NAME" -d "$PROJECT_DIR"
          shopt -s nullglob
          dirs=("$PROJECT_DIR"/*/)
          if [ ${#dirs[@]} -eq 1 ] && [ -d "${dirs[0]}" ]; then
            candidate="${dirs[0]%/}"
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ] || [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ] || [ -f "$candidate/gradlew" ]; then
              echo "BUILD_ROOT=$candidate" >> "$GITHUB_ENV"
            else
              echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
            fi
          else
            echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare and patch source
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            sed -i -E 's/(compileSdk([[:space:]]*=?[[:space:]]*)?)35\b/\136/g' "$file"
            sed -i -E 's/(compileSdkVersion([[:space:]]*=?[[:space:]]*)?)35\b/\136/g' "$file"
          done < <(find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/modernlauncher/MainActivity.kt')
          s=p.read_text()
          s=s.replace('import androidx.compose.runtime.composed\n','')
          s=s.replace('import androidx.compose.material3.isSystemInDarkTheme\n','')
          if 'import androidx.compose.foundation.horizontalScroll' not in s:
              s=s.replace('import androidx.compose.foundation.rememberScrollState\n','import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.horizontalScroll\n')
          if 'import androidx.compose.foundation.isSystemInDarkTheme' not in s:
              s=s.replace('import androidx.compose.material3.*\n','import androidx.compose.material3.*\nimport androidx.compose.foundation.isSystemInDarkTheme\n')
          s=s.replace('val spanY: Int = 2\n)', 'val spanY: Int = 2,\n    val providerKey: String = ""\n)')
          s=s.replace('decodeIconScales(p.getString("iconScales", ""))','decodeIconScales(p.getString("iconScales", "").orEmpty())')
          s=s.replace('decodeWidgets(p.getString("widgets_home", ""))','decodeWidgets(p.getString("widgets_home", "").orEmpty())')
          s=s.replace('override fun onNewIntent(intent:Intent?){ super.onNewIntent(intent); setIntent(intent) }','override fun onNewIntent(intent:Intent){ super.onNewIntent(intent); setIntent(intent) }')
          s=s.replace('onAddWidget={activity?.let { { it.pickWidget() } } ?: {}}','onAddWidget={ activity?.pickWidget(); Unit }')
          s=s.replace('@Composable private fun ThemeChoice(', '@Composable private fun RowScope.ThemeChoice(')
          s=s.replace('val cell=((maxWidth.toPx()-gap*(cols-1))/cols).coerceAtLeast(1f)','val cell=(with(density){maxWidth.toPx()}-gap*(cols-1))/cols.coerceAtMost(5).coerceAtLeast(1).toFloat()')
          s=s.replace('(86.dp.value*density+gap)','(with(density){86.dp.toPx()}+gap)')
          s=s.replace('private fun Modifier.clickableWithoutRipple(onClick:()->Unit)=composedClickable(onClick)\n@Composable private fun composedClickable(onClick:()->Unit):Modifier{val interaction=remember{androidx.compose.foundation.interaction.MutableInteractionSource()};return Modifier.then(Modifier.clickable(interactionSource=interaction,indication=null,onClick=onClick))}','private fun Modifier.clickableWithoutRipple(onClick:()->Unit)=Modifier.clickable(interactionSource=androidx.compose.foundation.interaction.MutableInteractionSource(),indication=null,onClick=onClick)')
          # EdgePanel: reference the Activity captured in composable scope.
          s=s.replace('edgeContext.pickWallpaper()', 'hostActivity?.pickWallpaper()')
          s=s.replace('EdgeAction("Wallpaper","Choose wallpaper",accent){(LocalContext.current as? MainActivity)?.pickWallpaper();onClose()}', 'EdgeAction("Wallpaper","Choose wallpaper",accent,muted){hostActivity?.pickWallpaper();onClose()}')
          s=s.replace('@Composable private fun EdgePanel(vm:LauncherViewModel,bg:Color,surface:Color,text:Color,muted:Color,accent:Color,onClose:()->Unit){', '@Composable private fun EdgePanel(vm:LauncherViewModel,bg:Color,surface:Color,text:Color,muted:Color,accent:Color,onClose:()->Unit){\n    val hostActivity=LocalContext.current as? MainActivity')
          s=s.replace('EdgeAction("Apps","Open app drawer",accent)', 'EdgeAction("Apps","Open app drawer",accent,muted)')
          s=s.replace('EdgeAction("Settings","Launcher controls",accent)', 'EdgeAction("Settings","Launcher controls",accent,muted)')
          s=s.replace('EdgeAction("Theme","Toggle light / dark",accent)', 'EdgeAction("Theme","Toggle light / dark",accent,muted)')
          s=s.replace('EdgeAction("Grid","Change home grid",accent)', 'EdgeAction("Grid","Change home grid",accent,muted)')
          s=s.replace('@Composable private fun EdgeAction(title:String,subtitle:String,accent:Color,onClick:()->Unit)', '@Composable private fun EdgeAction(title:String,subtitle:String,accent:Color,muted:Color,onClick:()->Unit)')
          # AnalogClock: capture the composable dark-theme value before drawBehind.
          marker='@Composable private fun AnalogClock(text:Color){'
          start=s.find(marker)
          if start>=0:
              end=s.find('\n@Composable',start+len(marker))
              if end<0: end=len(s)
              block=s[start:end]
              if 'val dark=' not in block:
                  pos=block.find('\n')+1
                  block=block[:pos]+'    val dark=androidx.compose.foundation.isSystemInDarkTheme()\n'+block[pos:]
              block=block.replace('isSystemInDarkTheme()', 'dark')
              s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: ${{ env.BUILD_ROOT }}
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        run: test -n "$(find "$BUILD_ROOT" -type f -name '*.apk' -print -quit)"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-debug-apk
          path: ${{ env.BUILD_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
