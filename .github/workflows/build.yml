name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIP_NAME: ModernLauncher_TecnoSpark8C_VivoY11_UX_v1.5.zip
  PROJECT_DIR: android-project
  GRADLE_VERSION: '9.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP_NAME" -d "$PROJECT_DIR"

          shopt -s nullglob
          dirs=("$PROJECT_DIR"/*/)
          if [ ${#dirs[@]} -eq 1 ] && [ -d "${dirs[0]}" ]; then
            candidate="${dirs[0]%/}"
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ] || [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ] || [ -f "$candidate/gradlew" ]; then
              echo "BUILD_ROOT=$candidate" >> "$GITHUB_ENV"
            else
              echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
            fi
          else
            echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Prepare project
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          rm -rf .gradle

      - name: Build debug APK with Gradle 9.5.1
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          find "$BUILD_ROOT" -type f -name '*.apk' -print
          test -n "$(find "$BUILD_ROOT" -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-debug-apk
          path: ${{ env.BUILD_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
