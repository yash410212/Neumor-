name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIP_NAME: ModernLauncher_TecnoSpark8C_VivoY11_UX_v1.5.zip
  PROJECT_DIR: android-project

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP_NAME" -d "$PROJECT_DIR"
          shopt -s nullglob
          dirs=("$PROJECT_DIR"/*/)
          if [ ${#dirs[@]} -eq 1 ] && [ -d "${dirs[0]}" ]; then
            candidate="${dirs[0]%/}"
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ] || [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ] || [ -f "$candidate/gradlew" ]; then
              echo "BUILD_ROOT=$candidate" >> "$GITHUB_ENV"
            else
              echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
            fi
          else
            echo "BUILD_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36 platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare project
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          rm -rf .gradle
          while IFS= read -r -d '' file; do
            sed -i -E 's/(compileSdk([[:space:]]*=?[[:space:]]*)?)35\b/\136/g' "$file"
            sed -i -E 's/(compileSdkVersion([[:space:]]*=?[[:space:]]*)?)35\b/\136/g' "$file"
          done < <(find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)
          echo "Effective compileSdk declarations:"
          grep -RInE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+' --include='build.gradle' --include='build.gradle.kts' . || true
          gradle --version

      - name: Upload source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-source-diagnostic
          path: ${{ env.BUILD_ROOT }}/app/src/main/java/com/example/modernlauncher/MainActivity.kt
          if-no-files-found: error
          retention-days: 3

      - name: Build debug APK
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          find "$BUILD_ROOT" -type f -name '*.apk' -print
          test -n "$(find "$BUILD_ROOT" -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-debug-apk
          path: ${{ env.BUILD_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
